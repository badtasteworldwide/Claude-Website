<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Frame Garage</title>
<meta name="description" content="Every Bad Taste license plate frame on one generic 3D model. Pick a design, spin it, swap finishes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: garage showroom. A catalog rail on the left, the 3D bay fills the rest; stacks on phones. */
:root {
  --bg: #e9ebef;
  --panel: #f7f8fa;
  --bay: #dfe2e8;
  --bay-glow: #ffffff;
  --line: #cfd3db;
  --fg: #16181d;
  --muted: #5b616d;
  --pink: #d81b6d;
  --pink-soft: #d81b6d1f;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --rail: 340px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --panel: #16191e; --bay: #0c0e11; --bay-glow: #262b33;
    --line: #272b33; --fg: #eceef1; --muted: #8d94a1; --pink: #ff4f9a; --pink-soft: #ff4f9a24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --panel: #16191e; --bay: #0c0e11; --bay-glow: #262b33;
  --line: #272b33; --fg: #eceef1; --muted: #8d94a1; --pink: #ff4f9a; --pink-soft: #ff4f9a24;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.5 var(--body);
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

/* ---------- catalog rail ---------- */
.rail {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.brand {
  padding: 20px 20px 14px;
  display: grid;
  gap: 2px;
}
.brand small {
  font: 500 11px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--pink);
}
.brand h1 {
  margin: 0;
  font: 900 34px/0.95 var(--display);
  text-transform: uppercase;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.search {
  margin: 4px 20px 12px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 9px 12px 9px 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
}
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--muted); }
.list {
  overflow-y: auto;
  padding: 0 12px 24px;
  display: grid;
  gap: 18px;
  align-content: start;
  min-height: 0;
}
.filter { margin: 0 20px 12px; display: flex; }
.filter .btn { flex: 1; justify-content: center; }
.filter .n { font: 500 11px var(--mono); opacity: 0.7; font-variant-numeric: tabular-nums; }
.group > summary { list-style: none; cursor: pointer; border-radius: 8px; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary:hover h2 { color: var(--pink); }
.group > summary h2::after { content: "▾"; font: 400 12px var(--mono); color: var(--muted); margin-left: 6px; order: 3; }
.group:not([open]) > summary h2::after { content: "▸"; }
.card .tag { font: 500 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.group h2 {
  margin: 0;
  padding: 10px 8px 2px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font: 700 20px/1.1 var(--display);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.group h2 span { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.08em; }
.group p { margin: 0 8px 8px; font-size: 12.5px; color: var(--muted); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card {
  display: grid;
  gap: 6px;
  padding: 8px 8px 9px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: none;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.card:hover { background: var(--bg); }
.card[aria-current="true"] { background: var(--pink-soft); border-color: var(--pink); }

.card .thumb { width: 100%; aspect-ratio: 320 / 164; display: block; background-image: var(--thumbs); background-size: var(--thumb-size); filter: drop-shadow(0 2px 3px #0003); }
.card b { font-weight: 600; font-size: 13px; line-height: 1.2; }
.empty { margin: 8px; color: var(--muted); font-size: 13px; }

/* ---------- 3D bay ---------- */
.bay {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: radial-gradient(120% 80% at 50% 40%, var(--bay-glow), var(--bay) 70%);
  overflow: hidden;
}
.bay canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.bay canvas:active { cursor: grabbing; }
.plaque {
  position: absolute;
  left: clamp(16px, 3vw, 36px);
  top: clamp(16px, 3vw, 32px);
  right: 16px;
  pointer-events: none;
  display: grid;
  gap: 4px;
}
.plaque .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--pink); }
.plaque h2 {
  margin: 0;
  font: 900 clamp(40px, 6vw, 76px)/0.9 var(--display);
  text-transform: uppercase;
  letter-spacing: 0.005em;
}
.plaque p { margin: 2px 0 0; color: var(--muted); max-width: 46ch; }
.spec {
  position: absolute;
  right: clamp(16px, 3vw, 32px);
  top: clamp(16px, 3vw, 32px);
  display: grid;
  gap: 2px;
  text-align: right;
  font: 400 11.5px/1.45 var(--mono);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.spec b { color: var(--fg); font-weight: 500; }

.dock {
  position: absolute;
  left: 50%;
  bottom: clamp(14px, 3vw, 28px);
  translate: -50% 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 14px;
  max-width: calc(100% - 32px);
}
.dock .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border: 0;
  border-radius: 9px;
  background: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--bg); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; background: none; color: inherit; }
.btn.icon { padding: 7px 9px; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 2px; }
.seg .btn { padding: 6px 10px; }
.spec .hint { margin-top: 8px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 500 12px var(--mono); pointer-events: none; }

@media (max-width: 820px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); overflow: auto; height: auto; }
  html { height: auto; }
  .bay { order: -1; height: clamp(360px, 70vw + 110px, 560px); }
  .rail { border-right: 0; border-top: 1px solid var(--line); }
  .list { overflow: visible; padding-inline: 16px; }
  .brand, .search { margin-inline: 0; padding-inline: 16px; }
  .search { padding-inline: 16px; }
  .search svg { left: 27px; }
  .filter { margin-inline: 16px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .spec { display: none; }
  .dock {
    left: 16px; right: 16px; bottom: 12px; translate: none; max-width: none;
    flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none;
  }
  .dock .sep { display: none; }
  .plaque h2 { font-size: 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<aside class="rail" aria-label="Plate frame designs">
  <header class="brand">
    <small>Bad Taste Worldwide</small>
    <h1>Plate Frame Garage</h1>
  </header>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search 280+ designs…" autocomplete="off" aria-label="Search designs">
  </label>
  <div class="seg filter" role="group" aria-label="Which designs to show">
    <button class="btn" id="f-current" aria-pressed="true" title="Latest DomSem production files">Current <span class="n" id="n-current"></span></button>
    <button class="btn" id="f-archive" aria-pressed="false" title="Older design files with no DomSem version">Archive <span class="n" id="n-archive"></span></button>
    <button class="btn" id="f-all" aria-pressed="false">All</button>
  </div>
  <nav class="list" id="list"></nav>
</aside>

<main class="bay" id="bay">
  <canvas id="stage" aria-label="3D preview of the selected plate frame. Drag to rotate, scroll or pinch to zoom."></canvas>
  <div class="loading" id="loading">Loading 3D bay…</div>
  <div class="plaque" aria-live="polite">
    <span class="eyebrow" id="eyebrow"></span>
    <h2 id="name"></h2>
    <p id="detail"></p>
  </div>
  <div class="spec" aria-hidden="true">
    <span><b>12.31 × 6.32</b> in outer</span>
    <span><b>7.05</b> in mount c/c</span>
    <span><b id="pos">–</b></span>
    <span class="hint">Drag to orbit · scroll to zoom<br>← → to switch designs</span>
  </div>
  <div class="dock" role="toolbar" aria-label="Viewer controls">
    <button class="btn icon" id="prev" aria-label="Previous design"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="btn" id="plate" aria-pressed="true">Plate</button>
    <button class="btn" id="gloss" title="Finish: gloss. Click to switch.">Gloss</button>
    <button class="btn" id="spin" aria-pressed="false">Turntable</button>
    <button class="btn" id="reset">Reset</button>
    <span class="sep"></span>
    <button class="btn icon" id="next" aria-label="Next design"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
